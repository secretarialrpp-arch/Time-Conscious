<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Professional — Exam Reality</title>

<style>
  :root {
    --bg: #ffffff;
    --card: rgba(0,0,0,0.03);
    --border: rgba(0,0,0,0.08);
    --text: #111;
    --muted: rgba(0,0,0,0.55);
    --danger: #ef4444;
    --primary: linear-gradient(90deg, #3b82f6, #ef4444);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.06);
      --text: #e8e8e8;
      --muted: rgba(255,255,255,0.5);
    }
  }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Inter, sans-serif;
  }

  .container {
    max-width: 340px;
    border-radius: 16px;
    padding: 16px;
    background: var(--card);
    box-shadow: 0 0 0 1px var(--border);
  }

  .title {
    font-size: 12px;
    opacity: .75;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: .5; }
    100% { transform: scale(1); opacity: 1; }
  }

  .section {
    margin-bottom: 16px;
  }

  .label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .value {
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }

  .bar {
    width: 100%;
    height: 8px;
    background: rgba(0,0,0,0.12);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 6px;
  }

  .fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 0.3s linear;
  }

  .shadow {
    height: 4px;
    background: rgba(239,68,68,0.35);
    border-radius: 999px;
    margin-top: 6px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 14px 0;
  }

  .decision {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.4s ease;
    font-size: 13px;
    line-height: 1.4;
    color: var(--muted);
  }

  .container:hover .decision,
  .container:focus-within .decision {
    opacity: 1;
    max-height: 200px;
    margin-top: 10px;
  }

  .decision strong {
    color: var(--text);
  }
</style>
</head>

<body>
<div class="container" tabindex="0">

  <!-- TITLE -->
  <div class="title">
    CS Professional Exam
    <span class="dot"></span>
    Reality
  </div>

  <!-- COUNTDOWN -->
  <div class="section">
    <div class="label">Exam starts in</div>
    <div class="value" id="daysLeft">—</div>

    <div class="bar">
      <div class="fill" id="examFill"></div>
    </div>

    <div class="label" style="margin-top:6px;">
      Fail cost: +365 days
    </div>
    <div class="shadow"></div>
  </div>

  <div class="divider"></div>

  <!-- TIME VALUE -->
  <div class="section">
    <div class="row">
      <span class="label">10 minutes</span>
      <span class="value" id="tenMin">—</span>
    </div>
    <div class="row">
      <span class="label">1 hour</span>
      <span class="value" id="hour">—</span>
    </div>
    <div class="row">
      <span class="label">1 day</span>
      <span class="value" id="day">—</span>
    </div>
  </div>

  <!-- DECISION FILTER -->
  <div class="decision">
    <strong>Decision check:</strong><br>
    Would I trade <strong>1 full year of my life at age 25</strong>
    for what I’m doing right now?
  </div>

</div>

<script>
  /* ===== EXAM CONSTANTS ===== */

  // Prep start (adjust if needed)
  const START_DATE = new Date(2025, 0, 1);   // 1 Jan 2025
  const EXAM_DATE  = new Date(2026, 11, 22); // 22 Dec 2026

  const PENALTY_SECONDS = 365 * 86400;

  function formatExact(sec) {
    sec = Math.floor(sec);
    const d = Math.floor(sec / 86400);
    sec %= 86400;
    const h = Math.floor(sec / 3600);
    sec %= 3600;
    const m = Math.floor(sec / 60);
    const s = sec % 60;

    if (d) return `${d}d ${h}h`;
    if (h) return `${h}h ${m}m`;
    return `${m}m ${s}s`;
  }

  function update() {
    const now = new Date();
    const remaining = (EXAM_DATE - now) / 1000;
    const totalWindow = (EXAM_DATE - START_DATE) / 1000;

    if (remaining <= 0) {
      daysLeft.textContent = "Exam in progress";
      examFill.style.width = "100%";
      return;
    }

    // Countdown
    const days = Math.ceil(remaining / 86400);
    daysLeft.textContent = `${days} days`;

    // Linear exam progress (NO penalty mixed in)
    const elapsed = totalWindow - remaining;
    const progress = Math.max(0, Math.min(1, elapsed / totalWindow));
    examFill.style.width = (progress * 100) + "%";

    // Exam Time Value (penalty applied here ONLY)
    const ETV = (remaining + PENALTY_SECONDS) / remaining;

    tenMin.textContent = formatExact(600 * ETV);
    hour.textContent   = formatExact(3600 * ETV);
    day.textContent    = formatExact(86400 * ETV);
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
